<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Talos — Calculateur ROI (preview)</title>
<!--
  ⚠️ HARNAIS DE PREVIEW UNIQUEMENT — ne fait pas partie du livrable.
  Le composant réel est ROICalculator.jsx (imports lucide-react + Tailwind
  configuré côté projet Next.js/Vite). Ici, React/Babel/Tailwind sont
  chargés via CDN et les icônes lucide sont remplacées par des SVG inline
  de même nom, uniquement pour pouvoir exécuter et vérifier le composant
  dans un simple fichier, sans étape de build.
-->
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<style>body{background:#140F0C;margin:0}</style>
</head>
<body>
<div id="root"></div>

<!--
  type="text/plain" : le navigateur n'exécute pas ce bloc tel quel — on le
  transforme nous-mêmes ci-dessous avec runtime:"classic" explicite.
  (Le scan automatique de babel-standalone, via data-presets="react", pousse
  le "automatic runtime" par défaut et injecte un `import` illégal hors module.)
-->
<script type="text/plain" id="app-src">
const { useState, useMemo } = React;

/* ── stand-ins lucide-react (mêmes noms, mêmes props size/className) ── */
function Icon({ children, size = 18, ...p }) {
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none"
      stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}>
      {children}
    </svg>
  );
}
const Clock      = (p) => <Icon {...p}><circle cx="12" cy="12" r="9.5"/><path d="M12 7v5l3.5 2"/></Icon>;
const TrendingUp  = (p) => <Icon {...p}><path d="M3 17l5-5 4 3 6-8"/><path d="M14 6h6v6"/></Icon>;
const Wallet      = (p) => <Icon {...p}><path d="M3 7.5A2.5 2.5 0 0 1 5.5 5h11A2.5 2.5 0 0 1 19 7.5V8h.5A2.5 2.5 0 0 1 22 10.5v6a2.5 2.5 0 0 1-2.5 2.5h-14A2.5 2.5 0 0 1 3 16.5z"/><circle cx="16.5" cy="14" r="1.4"/></Icon>;
const ArrowRight  = (p) => <Icon {...p}><path d="M5 12h14M13 6l6 6-6 6"/></Icon>;

/* ═══════════ à partir d'ici : copie fidèle de ROICalculator.jsx ═══════════ */

const fmtEUR = new Intl.NumberFormat('fr-FR', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 });
const fmtHeures = new Intl.NumberFormat('fr-FR', { maximumFractionDigits: 1 });

const INK      = '#140F0C';
const INK_2    = '#1C1611';
const GRAPHITE = '#352A20';
const PARCH    = '#F6EEE7';
const LINE     = 'rgba(246,238,231,.08)';
const BRONZE   = '#E0631F';
const BRONZE_2 = '#9A3F12';

function ROISlider({ id, label, icon: IconC, value, onChange, min, max, step, formatValue }) {
  const pct = ((value - min) / (max - min)) * 100;
  return (
    <div>
      <label htmlFor={id} className="mb-3 flex items-center justify-between gap-3">
        <span className="flex items-center gap-2 text-sm font-semibold text-white/75">
          <IconC size={16} className="shrink-0" style={{ color: BRONZE }} aria-hidden="true" />
          {label}
        </span>
        <span className="font-mono text-sm font-bold tabular-nums" style={{ color: PARCH }}>
          {formatValue(value)}
        </span>
      </label>
      <input
        id={id} type="range" min={min} max={max} step={step} value={value}
        onChange={(e) => onChange(Number(e.target.value))}
        aria-valuenow={value} aria-valuemin={min} aria-valuemax={max} aria-valuetext={formatValue(value)}
        className="h-2 w-full cursor-pointer appearance-none rounded-full accent-[#E0631F]
          [&::-webkit-slider-thumb]:h-5 [&::-webkit-slider-thumb]:w-5 [&::-webkit-slider-thumb]:appearance-none
          [&::-webkit-slider-thumb]:rounded-full [&::-webkit-slider-thumb]:border-2
          [&::-webkit-slider-thumb]:border-[#E0631F] [&::-webkit-slider-thumb]:bg-white
          [&::-webkit-slider-thumb]:shadow-md [&::-webkit-slider-thumb]:cursor-pointer
          [&::-moz-range-thumb]:h-5 [&::-moz-range-thumb]:w-5 [&::-moz-range-thumb]:appearance-none
          [&::-moz-range-thumb]:rounded-full [&::-moz-range-thumb]:border-2
          [&::-moz-range-thumb]:border-[#E0631F] [&::-moz-range-thumb]:bg-white
          [&::-moz-range-thumb]:shadow-md [&::-moz-range-thumb]:cursor-pointer"
        style={{ background: `linear-gradient(to right, ${BRONZE} ${pct}%, ${GRAPHITE} ${pct}%)` }}
      />
    </div>
  );
}

function ResultCard({ icon: IconC, value, label, sub }) {
  return (
    <div className="rounded-2xl border p-6" style={{ background: INK_2, borderColor: LINE }}>
      <div className="mb-3 flex items-center gap-2">
        <span className="flex h-9 w-9 items-center justify-center rounded-xl"
          style={{ background: 'rgba(224,99,31,.12)', border: '1px solid rgba(224,99,31,.28)' }}>
          <IconC size={18} style={{ color: BRONZE }} aria-hidden="true" />
        </span>
        <span className="text-sm font-semibold text-white/70">{label}</span>
      </div>
      <div className="text-3xl font-extrabold tracking-tight" style={{ color: PARCH }}>{value}</div>
      <p className="mt-2 text-sm leading-relaxed text-white/55">{sub}</p>
    </div>
  );
}

function ROICalculator() {
  const [devisParMois, setDevisParMois] = useState(15);
  const [montantMoyen, setMontantMoyen] = useState(3000);

  const { tempsRecupere, chantiersSupp, caAdditionnel } = useMemo(() => {
    const chantiers = Math.round(devisParMois * 0.15);
    return { tempsRecupere: devisParMois * 1.5, chantiersSupp: chantiers, caAdditionnel: chantiers * montantMoyen };
  }, [devisParMois, montantMoyen]);

  const ctaLabel = chantiersSupp > 0
    ? `Voir comment récupérer ces ${fmtEUR.format(caAdditionnel)} (Démo 15 min) →`
    : `Voir comment gagner ${fmtHeures.format(tempsRecupere)} h dès ce mois-ci (Démo 15 min) →`;

  return (
    <section className="px-6 py-24" style={{ background: INK }} id="roi-section">
      <div className="mx-auto max-w-6xl">
        <div className="mb-14 max-w-2xl">
          <span className="inline-flex items-center gap-2 rounded-full border px-4 py-1.5 font-mono text-[11px] font-bold uppercase tracking-[0.2em]"
            style={{ borderColor: 'rgba(246,238,231,.15)', color: '#AB9F95' }}>
            <span className="h-1.5 w-1.5 rounded-full" style={{ background: BRONZE }} />
            Calculez votre gain
          </span>
          <h2 className="mt-4 text-3xl font-extrabold tracking-tight sm:text-4xl" style={{ color: PARCH }}>
            Ce que Talos change dans <em className="not-italic" style={{ color: BRONZE }}>votre chiffre d'affaires.</em>
          </h2>
          <p className="mt-4 text-lg text-white/60">
            Ajustez les deux curseurs selon votre activité réelle — les résultats se mettent à jour instantanément.
          </p>
        </div>

        <div className="grid grid-cols-1 gap-10 lg:grid-cols-2 lg:gap-16">
          <div className="rounded-2xl border p-8 sm:p-10" style={{ background: INK_2, borderColor: LINE }}>
            <div className="flex flex-col gap-10">
              <ROISlider id="devisParMois" label="Devis par mois" icon={TrendingUp}
                value={devisParMois} onChange={setDevisParMois} min={1} max={50} step={1}
                formatValue={(v) => `${v} devis`} />
              <ROISlider id="montantMoyen" label="Montant moyen d'un chantier" icon={Wallet}
                value={montantMoyen} onChange={setMontantMoyen} min={500} max={20000} step={500}
                formatValue={(v) => fmtEUR.format(v)} />
            </div>
          </div>

          <div className="flex flex-col gap-5">
            <ResultCard icon={Clock} value={`${fmtHeures.format(tempsRecupere)} h / mois`}
              label="Temps récupéré" sub="Fini les soirées sur l'ordinateur et les week-ends sacrifiés." />
            <ResultCard icon={TrendingUp} value={`+${chantiersSupp} chantier${chantiersSupp > 1 ? 's' : ''}`}
              label="Chantiers supplémentaires signés" sub="En répondant dans l'heure, vous devancez vos concurrents." />

            <div className="rounded-2xl p-8 text-white shadow-2xl" id="ca-card"
              style={{ background: `linear-gradient(150deg, ${BRONZE_2}, ${BRONZE})` }}>
              <div className="mb-3 flex items-center gap-2">
                <span className="flex h-9 w-9 items-center justify-center rounded-xl bg-white/15">
                  <Wallet size={18} aria-hidden="true" />
                </span>
                <span className="text-sm font-semibold text-white/85">Chiffre d'affaires additionnel / mois</span>
              </div>
              <div className="text-5xl font-extrabold tracking-tight tabular-nums" id="ca-value">
                {fmtEUR.format(caAdditionnel)}
              </div>
              <p className="mt-3 text-sm leading-relaxed text-white/85">
                Rentabilisez Talos dès votre premier chantier signé.
              </p>
            </div>
          </div>
        </div>

        <div className="mt-12 flex justify-center">
          <a href="/reserver" id="cta-link"
            className="inline-flex min-h-[54px] items-center gap-2 rounded-full px-8 text-base font-bold text-white transition-transform hover:-translate-y-0.5"
            style={{ background: BRONZE }}>
            {ctaLabel}
            <ArrowRight size={18} aria-hidden="true" />
          </a>
        </div>
      </div>
    </section>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<ROICalculator />);
</script>

<script>
  var src = document.getElementById('app-src').textContent;
  var out = Babel.transform(src, { presets: [['react', { runtime: 'classic' }]] }).code;
  (0, eval)(out);
</script>
</body>
</html>
