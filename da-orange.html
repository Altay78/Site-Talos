<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<title>Talos — DA Orange (style Arounda)</title>
<style>
  :root{
    --orange:#FF6D29; --brun:#453027; --noir:#161316; --gris:#BABABA; --blanc:#FFFFFF;
    --font:'Neue Montreal','PP Neue Montreal','Inter','Helvetica Neue',Arial,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--noir);font-family:var(--font);-webkit-font-smoothing:antialiased;}
  .board{position:relative;width:1080px;height:1350px;overflow:hidden;color:var(--blanc);}

  /* warm molten gradient (dark brown -> orange glow) */
  .bg{position:absolute;inset:0;background:
    radial-gradient(ellipse 95% 70% at 50% 82%, rgba(255,109,41,0.85) 0%, rgba(193,84,31,0.55) 22%, rgba(90,55,32,0.5) 45%, rgba(42,29,23,0.6) 68%, #161316 100%),
    linear-gradient(180deg, #1a1513 0%, #161316 100%);}
  .bg-soft{position:absolute;inset:0;background:radial-gradient(ellipse 60% 40% at 50% 92%, rgba(255,150,80,0.5), transparent 60%);mix-blend-mode:screen;}
  .grain{position:absolute;inset:0;opacity:0.4;mix-blend-mode:overlay;pointer-events:none;}
  .vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 80% 80% at 50% 50%,transparent 50%,rgba(0,0,0,0.5));}

  /* top row */
  .top{position:relative;z-index:3;display:flex;justify-content:space-between;align-items:center;padding:48px 56px 0;}
  .top .l{font-size:18px;font-weight:500;letter-spacing:0.2px;color:rgba(255,255,255,0.92);}
  .top .logo svg{height:24px;}

  /* typography block */
  .type-wrap{position:relative;z-index:3;text-align:center;margin-top:330px;}
  .label{font-size:20px;font-weight:400;color:rgba(255,255,255,0.85);margin-bottom:26px;letter-spacing:0.3px;}
  .specimen{font-size:118px;font-weight:500;letter-spacing:-3px;line-height:0.95;}
  .specimen .a{color:var(--blanc);}
  .specimen .b{background:linear-gradient(100deg,#FFFFFF 0%,#FFB07A 45%,#FF6D29 100%);-webkit-background-clip:text;background-clip:text;color:transparent;}
  .weights{display:flex;justify-content:center;gap:90px;margin-top:30px;font-size:22px;color:rgba(255,255,255,0.62);}

  /* palette */
  .palette{position:relative;z-index:3;margin-top:110px;text-align:center;}
  .palette .label{margin-bottom:30px;}
  .pills{display:flex;flex-direction:column;align-items:center;gap:18px;}
  .prow{display:flex;justify-content:center;gap:18px;}
  .pill{display:flex;align-items:center;gap:18px;width:300px;padding:14px 22px;border-radius:100px;
    background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.16);backdrop-filter:blur(6px);}
  .pill .dot{width:44px;height:44px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,0.12);}
  .pill .hex{font-size:24px;font-weight:500;letter-spacing:0.5px;color:var(--blanc);}
</style>
</head>
<body>
<div class="board">
  <div class="bg"></div>
  <div class="bg-soft"></div>

  <div class="top">
    <div class="l">Plateforme d'automatisation par IA</div>
    <div class="logo">
      <svg viewBox="0 0 380 120" xmlns="http://www.w3.org/2000/svg"><g fill="#FFFFFF"><rect x="0" y="18" width="62" height="14"/><path d="M 24 32 L 14 60 L 27 60 L 19 104 L 50 58 L 37 58 L 44 32 Z"/></g><text x="66" y="100" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="100" fill="#FFFFFF" font-weight="600" letter-spacing="-4">ALOS</text></svg>
    </div>
  </div>

  <div class="type-wrap">
    <div class="label">Typographie</div>
    <div class="specimen"><span class="a">Neue</span> <span class="b">Montreal</span></div>
    <div class="weights"><span>Regular</span><span>Medium</span><span>Semibold</span></div>
  </div>

  <div class="palette">
    <div class="label">Palette couleur</div>
    <div class="pills">
      <div class="prow">
        <div class="pill"><span class="dot" style="background:#FF6D29"></span><span class="hex">#FF6D29</span></div>
        <div class="pill"><span class="dot" style="background:#453027"></span><span class="hex">#453027</span></div>
        <div class="pill"><span class="dot" style="background:#161316"></span><span class="hex">#161316</span></div>
      </div>
      <div class="prow">
        <div class="pill"><span class="dot" style="background:#BABABA"></span><span class="hex">#BABABA</span></div>
        <div class="pill"><span class="dot" style="background:#FFFFFF"></span><span class="hex">#FFFFFF</span></div>
      </div>
    </div>
  </div>

  <div class="vig"></div>
  <svg class="grain"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope="0.5"/></feComponentTransfer></filter><rect width="100%" height="100%" filter="url(#n)"/></svg>
</div>
</body>
</html>
